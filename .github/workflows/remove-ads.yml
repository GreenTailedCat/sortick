name: Remove ad scripts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-ads:
    if: ${{ !contains(github.event.head_commit.message, '[skip-remove-ads]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove AdSense and Adcash scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """  <script id=\"aclib\" type=\"text/javascript\" src=\"//acscdn.com/script/aclib.js\"></script>\n<script type=\"text/javascript\">\n    aclib.runAutoTag({\n        zoneId: 'dy5znlrchq',\n    });\n</script>\n"""
          new = ""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('Adcash block not found; refusing to modify index.html.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/remove-ads.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/remove-ads.yml
          git commit -m 'Remover anúncios do site [skip-remove-ads]'
          git push
